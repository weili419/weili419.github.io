<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>泰国 A／B 方案 · 每日旅行地图</title><link rel="stylesheet" href="map-vendor/maplibre-gl.css"><link rel="stylesheet" href="trip-map.css"><link rel="stylesheet" href="trip-food.css"><link rel="stylesheet" href="trip-plan.css"></head>
<body>
<div class="map-app">
 <header class="map-heading"><div><span class="eyebrow">THAILAND, DAY BY DAY</span><h1>同一张地图，两种返程</h1><p id="map-period">2026.9.20—9.29 · 10 天 9 晚 · 3 人</p></div><nav class="map-plan" aria-label="选择返程方案"><button id="plan-A" aria-pressed="true">A · 9/29 回国</button><button id="plan-B" aria-pressed="false">B · 10/1 回国</button></nav></header>
 <nav class="dates" id="dates" aria-label="选择旅行日期"></nav>
 <div class="workspace">
  <aside class="sidebar" aria-label="当天行程">
   <div class="sidebar-head"><span id="day-kicker" class="eyebrow"></span><div class="day-navigation"><button id="previous" aria-label="前一天">←</button><button id="next" aria-label="后一天">→</button></div><h2 id="day-title"></h2><p id="day-intro"></p></div>
   <div class="sidebar-scroll"><div id="stay"></div><div id="stops"></div><div id="day-note" class="day-note"></div></div>
   <div class="sidebar-foot"><span style="color:#265dc9">✈ 机场</span><span style="color:#008c84">◆ 景点</span><span style="color:#087896">⚓ 码头</span><span style="color:#996125">巴 车站</span><span style="color:#8056b9">H 候选酒店</span><span style="color:#c8582e">F 美食备选</span><span style="color:#8e44ad">秀 演出</span><small>F 对应餐厅卡片；「食」可展开同一商场多家店。</small></div>
  </aside>
  <section class="map-area" aria-label="可拖动和缩放的行程地图">
   <div id="map"></div>
   <div class="map-tools"><button id="comparison">蓝红分支对比</button><button id="places" class="active">机场与景点</button><button id="foods">美食地图</button><button id="hotels">酒店对比</button><button id="overview">路线总览</button><button id="international">上海往返</button><button id="snorkel">浮潜点对比</button><button id="fit" title="缩放回当前行程">◎ 回到行程</button></div>
   <div id="map-caption" class="map-caption"><b>两种返程，3 座目的地</b><span>点城市或上方日期，展开每天的地点。</span></div>
   <div id="map-message" role="status">正在载入地图…</div>
   <div class="map-legend"><span class="dashed"></span>连线仅示意行程顺序，非实际道路／航线</div>
  </section>
 </div>
 <footer class="map-footer"><span>拖动平移 · 双击或 +/− 缩放 · 点击标记看详情</span><span>街道图需联网；内置地理概览可离线用 · 导航请核对入口</span></footer>
</div>
<noscript>请开启 JavaScript 查看互动地图。完整文字行程在本页下方。</noscript>
<script src="map-vendor/maplibre-gl.js"></script><script src="trip-data.js"></script><script src="hotel-data.js"></script><script src="food-data.js"></script><script src="trip-land.js"></script><script src="trip-map.js"></script>
</body></html>
